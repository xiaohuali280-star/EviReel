# Round-robin over the two API instances (no sticky sessions: any instance serves any request).
upstream evireel_api {
    server api-1:8000 max_fails=2 fail_timeout=5s;
    server api-2:8000 max_fails=2 fail_timeout=5s;
}
server {
    listen 8080;
    client_max_body_size 64m;          # uploads go to object storage by presigned URL; API bodies are small
    location /ws/ {
        proxy_pass http://evireel_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    # An instance that is stopping or gone: idempotent requests move to the other instance (nginx never
    # retries POST/DELETE on its own, so non-idempotent calls are not repeated).
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    location / {
        proxy_pass http://evireel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_buffering off;           # Range playback streams through
    }
}
