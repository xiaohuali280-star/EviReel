# E2 broker settings (development / CI).
# Celery acks late: a delivery stays unacked for the whole stage. RabbitMQ closes the channel of a
# delivery unacked longer than consumer_timeout, so it must exceed PIPELINE_TASK_TIME_LIMIT_S
# (default 3 h). 4 h, in milliseconds:
consumer_timeout = 14400000
# Refuse publishes (publisher confirms then fail) instead of filling the disk.
disk_free_limit.absolute = 512MB
