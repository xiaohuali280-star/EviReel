[build-system]
requires = [
    "setuptools>=61.0",
    "tomli>=2.0.1; python_version < '3.11'",
]
build-backend = "setuptools.build_meta"

[project]
name = "visual-agentic-memory"
version = "0.1.0"
description = "A streamlined framework for indexing video memory and performing agentic retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-dotenv",
    "httpx",
    "pydantic-settings",
    "python-multipart",
    "torch",
    "pillow>=10.0.0",
    "scikit-image>=0.21.0",
    "opencv-python<4.11",
    "numpy<2.0; python_version < '3.13'",
    "numpy>=2.0; python_version >= '3.13'",
    "rich",
    "python-pptx>=1.0,<2",
    "reportlab>=4,<5",
]

[project.scripts]
vam-tui = "vam.cli:run_tui"
vam-server = "vam.cli:run_server"

[tool.setuptools.packages.find]
namespaces = false
include = ["vam*"]

[tool.setuptools.package-data]
"vam.storage" = ["migrations/*.sql", "migrations_pg/*.sql"]
"vam.memory" = ["migrations/*.sql"]
"vam.platform" = ["migrations/*.sql"]
"vam.server" = ["static/*", "static/assets/*"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# E1 platform mode: PostgreSQL metadata + S3-compatible object storage
# E3: Redis carries shared model limits, the query-vector cache and cross-instance notifications.
platform = ["psycopg[binary]>=3.2,<3.3", "boto3>=1.35,<2", "redis>=5.2,<6"]
# E2 worker pipeline: Celery workers + outbox dispatcher on RabbitMQ (Linux / containers)
pipeline = ["celery>=5.5,<5.7"]
asr = ["faster-whisper>=1.2.1,<2"]
