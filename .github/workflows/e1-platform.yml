name: E1 platform (real PostgreSQL + MinIO)
on:
  push:
    branches: ["main"]
    paths: ["vam/**", "tests/**", "frontend/**", "deploy/e1/**", "pyproject.toml", "setup.cfg", ".github/workflows/e1-platform.yml"]
  pull_request:
    paths: ["vam/**", "tests/**", "frontend/**", "deploy/e1/**", "pyproject.toml", "setup.cfg", ".github/workflows/e1-platform.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SILICONFLOW_API_KEY: ""
      OPENROUTER_API_KEY: ""
      DASHSCOPE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway CI credentials (never reused)
        run: |
          {
            echo "EVIREEL_PG_USER=evireel"
            echo "EVIREEL_PG_PASSWORD=ci-$(openssl rand -hex 12)"
            echo "EVIREEL_S3_ACCESS_KEY=ci-$(openssl rand -hex 6)"
            echo "EVIREEL_S3_SECRET_KEY=ci-$(openssl rand -hex 16)"
            echo "EVIREEL_WEB_ORIGINS=http://127.0.0.1:8876"
          } > deploy/e1/dev.env
      - name: Start middleware from the committed compose file (health-gated)
        run: |
          docker compose --env-file deploy/e1/dev.env -f deploy/e1/compose.yml up -d --wait --wait-timeout 180
          docker compose --env-file deploy/e1/dev.env -f deploy/e1/compose.yml ps
          docker compose --env-file deploy/e1/dev.env -f deploy/e1/compose.yml exec -T postgres postgres --version
          docker compose --env-file deploy/e1/dev.env -f deploy/e1/compose.yml exec -T minio minio --version
      - name: Export test endpoints
        run: |
          set -a; . deploy/e1/dev.env; set +a
          echo "::add-mask::$EVIREEL_PG_PASSWORD"; echo "::add-mask::$EVIREEL_S3_SECRET_KEY"
          echo "EVIREEL_TEST_DATABASE_URL=postgresql://$EVIREEL_PG_USER:$EVIREEL_PG_PASSWORD@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
          echo "EVIREEL_TEST_S3_ENDPOINT=http://127.0.0.1:9000" >> "$GITHUB_ENV"
          echo "EVIREEL_TEST_S3_ACCESS_KEY=$EVIREEL_S3_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "EVIREEL_TEST_S3_SECRET_KEY=$EVIREEL_S3_SECRET_KEY" >> "$GITHUB_ENV"
          pw="e2e-$(openssl rand -hex 12)"; echo "::add-mask::$pw"; echo "EVIREEL_E2E_PASSWORD=$pw" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,platform]"
      - name: Schema migration dry-run and apply (fresh database)
        run: |
          python -m vam.platform.migrate --database-url "$EVIREEL_TEST_DATABASE_URL" schema --dry-run
      - name: E1 backend acceptance (real PostgreSQL + MinIO)
        run: python -m pytest tests/test_e1_unit.py tests/test_e1_platform.py -v -rs --junitxml=e1-test-results.xml
      - name: Frontend build and unit tests
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm test
          pnpm run build
          pnpm exec playwright install --with-deps chromium
      - name: E1 browser acceptance (real PostgreSQL + MinIO)
        run: |
          python tests/e1_browser_server.py --port 8876 > e1-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8876/__test__/health >/dev/null; then break; fi
            sleep 1
          done
          cd frontend
          EVIREEL_E1_URL=http://127.0.0.1:8876 pnpm exec playwright test e2e/upload-resume.spec.ts
      - name: Middleware logs
        if: always()
        run: docker compose --env-file deploy/e1/dev.env -f deploy/e1/compose.yml logs --no-color > e1-middleware.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: E1-validation
          path: |
            e1-test-results.xml
            e1-browser-server.log
            e1-middleware.log
            frontend/test-results/
            frontend/playwright-report/
