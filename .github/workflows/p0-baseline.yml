name: P0 cloud baseline
on:
  push:
    branches: ["codex/p0-source-audit-baseline"]
    paths: ["tests/**", ".github/workflows/p0-baseline.yml", "vam/**", "pyproject.toml"]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENABLE_RETRIEVAL: "false"
      SILICONFLOW_API_KEY: ""
      OPENROUTER_API_KEY: ""
      DASHSCOPE_API_KEY: ""
      FRAME_STORE_PATH: "data/p0-default.sqlite3"
      QUERY_INCLUDE_LATEST_SEGMENT_VIDEO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: FFmpeg system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Environment and syntax
        run: |
          git status --short --branch
          git rev-parse HEAD
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          python -c "import sys, sqlite3, torch, importlib.util; print('Python', sys.version); print('SQLite', sqlite3.sqlite_version); print('torch', torch.__version__, 'CUDA', torch.cuda.is_available()); print('faster_whisper', importlib.util.find_spec('faster_whisper')); print('Node is informational only')"
          node --version
          python -m pip freeze
          python -m compileall -q vam tests
      - name: Existing upstream baseline
        run: python -m unittest discover -s tests -p test_image_limits.py -v
      - name: P0 mock and FFmpeg probes
        if: always()
        run: python -m unittest discover -s tests -p test_p0_baseline.py -v
