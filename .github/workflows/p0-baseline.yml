name: EviReel CPU tests
on:
  push:
    branches: ["main", "codex/p1-video-management"]
    paths: ["vam/**", "tests/**", "pyproject.toml", "setup.cfg", ".github/workflows/p0-baseline.yml"]
  pull_request:
    paths: ["vam/**", "tests/**", "pyproject.toml", "setup.cfg", ".github/workflows/p0-baseline.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENABLE_RETRIEVAL: "false"
      SILICONFLOW_API_KEY: ""
      OPENROUTER_API_KEY: ""
      DASHSCOPE_API_KEY: ""
      FRAME_STORE_PATH: "data/test-default.sqlite3"
      DATA_ROOT: "data/test-server"
      QUERY_INCLUDE_LATEST_SEGMENT_VIDEO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Syntax and contracts
        run: |
          ffmpeg -version
          python -m compileall -q vam tests
          python -m pytest tests -q --junitxml=test-results.xml
